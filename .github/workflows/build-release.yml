name: Build Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target_tag:
        description: "Тег версии для сборки, например v1.1.5"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_tag || github.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained x64 application
        shell: pwsh
        run: |
          $version = (Select-String -Path .\YouTubeRadio.csproj -Pattern '<Version>([^<]+)</Version>').Matches.Groups[1].Value
          dotnet publish .\YouTubeRadio.csproj -c Release -r win-x64 --self-contained true -o ".\publish\win-x64-$version"
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish завершился с ошибкой" }
          Compress-Archive -Path ".\publish\win-x64-$version\*" -DestinationPath ".\publish\CatLuYNet-$version-win-x64.zip" -CompressionLevel Optimal
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" .\installer\CatLuYNet.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC завершился с ошибкой" }

      - name: Create or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '${{ inputs.target_tag }}' }
          $installer = ".\installer\Output\CatLuYNet-$env:VERSION-Setup.exe"
          $portable = ".\publish\CatLuYNet-$env:VERSION-win-x64.zip"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer $portable --clobber
          } else {
            gh release create $tag $installer $portable --title "CatLu YNet $env:VERSION" --notes-file .\FIX.md --verify-tag
          }
          if ($LASTEXITCODE -ne 0) { throw "Не удалось опубликовать файлы релиза" }
