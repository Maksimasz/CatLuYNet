name: Build Windows release

on:
  push:
    branches:
      - main
    paths:
      - YouTubeRadio.csproj
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target_tag:
        description: "Тег версии для сборки, например v1.1.5"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_tag || github.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Prepare FFmpeg tools
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          $unpacked = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          $url = 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip'
          $expected = ((Invoke-WebRequest "$url.sha256").Content.Trim() -split '\s+')[0]
          Invoke-WebRequest $url -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $expected) { throw 'FFmpeg checksum mismatch' }
          Expand-Archive $archive $unpacked
          foreach ($name in @('ffmpeg.exe', 'ffprobe.exe')) {
            $file = Get-ChildItem $unpacked -Recurse -File -Filter $name | Select-Object -First 1
            if (!$file) { throw "Missing $name" }
            Copy-Item -LiteralPath $file.FullName -Destination (Join-Path './tools' $name)
          }

      - name: Run regression checks
        shell: pwsh
        run: |
          dotnet run --project tests/RegressionTests.csproj -p:UseSharedCompilation=false
          if ($LASTEXITCODE -ne 0) { throw 'Regression checks failed' }

      - name: Publish self-contained x64 application
        shell: pwsh
        run: |
          $version = (Select-String -Path .\YouTubeRadio.csproj -Pattern '<Version>([^<]+)</Version>').Matches.Groups[1].Value
          dotnet publish .\YouTubeRadio.csproj -c Release -r win-x64 --self-contained true -o ".\publish\win-x64-$version"
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish завершился с ошибкой" }
          Compress-Archive -Path ".\publish\win-x64-$version\*" -DestinationPath ".\publish\CatLuYNet-$version-win-x64.zip" -CompressionLevel Optimal
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Check installer file replacement
        shell: pwsh
        run: |
          $compiler = @("C:\Program Files\Inno Setup 7\ISCC.exe", "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") |
            Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (!$compiler) { throw 'Inno Setup compiler not found' }
          .\tests\Installer.Tests.ps1 -Compiler $compiler

      - name: Build installer
        shell: pwsh
        run: |
          $compiler = @("C:\Program Files\Inno Setup 7\ISCC.exe", "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") |
            Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (!$compiler) { throw "Компилятор Inno Setup не найден" }
          .\installer\Build-Installer.ps1 -Compiler $compiler

      - name: Create or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } elseif ('${{ inputs.target_tag }}') { '${{ inputs.target_tag }}' } else { "v$env:VERSION" }
          $installer = ".\installer\Output\CatLuYNet-$env:VERSION-Setup.exe"
          $portable = ".\publish\CatLuYNet-$env:VERSION-win-x64.zip"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer $portable --clobber
          } else {
            gh release create $tag $installer $portable --target $env:GITHUB_SHA --title "CatLu YNet $env:VERSION" --notes-file .\FIX.md
          }
          if ($LASTEXITCODE -ne 0) { throw "Не удалось опубликовать файлы релиза" }
